services:
  postgres:
    image: postgres:16
    container_name: training-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
      POSTGRES_DB: ${POSTGRES_DB:-training_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-training} -d $${POSTGRES_DB:-training_db}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
